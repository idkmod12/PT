<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Snow Rider 3D</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9ed7f2;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%}#hud{position:fixed;inset:0;pointer-events:none;color:#10263c;text-shadow:0 1px 0 #fff;padding:18px;font-weight:700}#score{font-size:22px}#hint{font-size:13px;opacity:.8}#over{position:absolute;inset:0;display:none;place-items:center;background:#0c203866;color:#fff;text-align:center;text-shadow:none}#over.show{display:grid}.card{padding:24px 30px;border-radius:14px;background:#10263ce8}.card button{border:0;border-radius:8px;padding:10px 16px;background:#f2f7ff;color:#10263c;font-weight:700;cursor:pointer}</style></head><body><div id="hud"><div id="score">Distance 0 m</div><div id="hint">← → or A/D to steer</div></div><div id="over"><div class="card"><h1>Run over</h1><p id="final"></p><button id="again">Ride again</button></div></div><script src="./lib/three.min.js"></script><script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9ed7f2);scene.fog=new THREE.Fog(0x9ed7f2,35,150);const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,220);camera.position.set(0,4.8,8);const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xeaf8ff,0x466477,1.7));const sun=new THREE.DirectionalLight(0xffffff,1.2);sun.position.set(-20,30,10);scene.add(sun);
const snowMat=new THREE.MeshLambertMaterial({color:0xf4fbff}),trackMat=new THREE.MeshLambertMaterial({color:0xd9eef7}),darkMat=new THREE.MeshLambertMaterial({color:0x24465a}),redMat=new THREE.MeshLambertMaterial({color:0xd83c4b});
const track=new THREE.Mesh(new THREE.PlaneGeometry(24,260),trackMat);track.rotation.x=-Math.PI/2;track.position.set(0,-.2,-95);scene.add(track);const railMat=new THREE.MeshLambertMaterial({color:0x92c7dc});for(const x of [-10,10]){const rail=new THREE.Mesh(new THREE.BoxGeometry(.35,.25,260),railMat);rail.position.set(x,-.02,-95);scene.add(rail)}
const sled=new THREE.Group();const deck=new THREE.Mesh(new THREE.BoxGeometry(1.5,.18,2.6),redMat);deck.position.y=.65;sled.add(deck);const seat=new THREE.Mesh(new THREE.BoxGeometry(1.1,.45,1),darkMat);seat.position.set(0,.95,.25);sled.add(seat);sled.position.set(0,0,5);scene.add(sled);
const obstacles=[];function tree(z,x){const g=new THREE.Group();const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.18,.28,1.4,6),darkMat);trunk.position.y=.7;g.add(trunk);for(let i=0;i<3;i++){const cone=new THREE.Mesh(new THREE.ConeGeometry(1.25-i*.25,1.8,7),new THREE.MeshLambertMaterial({color:0x28664f}));cone.position.y=1.6+i*.8;g.add(cone)}g.position.set(x,0,z);scene.add(g);obstacles.push({g,x,z,r:1.05})}function rock(z,x){const g=new THREE.Mesh(new THREE.DodecahedronGeometry(.85,0),darkMat);g.position.set(x,.7,z);scene.add(g);obstacles.push({g,x,z,r:1})}for(let z=-15;z>-220;z-=10){const x=(Math.random()*16-8);Math.random()<.58?tree(z,x):rock(z,x)}
let left=false,right=false,running=true,distance=0,last=performance.now();addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key))left=true;if(['ArrowRight','d','D'].includes(e.key))right=true});addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))left=false;if(['ArrowRight','d','D'].includes(e.key))right=false});function reset(){location.reload()}document.querySelector('#again').onclick=reset;
function end(){running=false;document.querySelector('#final').textContent='Distance '+Math.floor(distance)+' m';document.querySelector('#over').classList.add('show')}
function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;if(running){const speed=15+Math.min(18,distance*.035);sled.position.x+=(right?1:0-(left?1:0))*dt*10;sled.position.x=Math.max(-8.4,Math.min(8.4,sled.position.x));distance+=speed*dt;for(const o of obstacles){o.g.position.z+=speed*dt;if(o.g.position.z>12){o.g.position.z=-220-Math.random()*40;o.g.position.x=Math.random()*16-8;o.x=o.g.position.x}const dx=o.g.position.x-sled.position.x,dz=o.g.position.z-sled.position.z;if(dx*dx+dz*dz<(o.r+.7)**2)end()}camera.position.x+=(sled.position.x*.25-camera.position.x)*dt*5;camera.lookAt(sled.position.x*.15,1,-8);document.querySelector('#score').textContent='Distance '+Math.floor(distance)+' m'}renderer.render(scene,camera);requestAnimationFrame(frame)}addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});requestAnimationFrame(frame);
</script></body></html>
