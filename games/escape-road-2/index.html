<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Escape Road 2</title>
<style>
html{box-sizing:border-box;overflow:hidden}*,*:before,*:after{box-sizing:inherit}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#unity-container{width:100vw;height:100vh;position:relative}
#unity-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;background:#000}
#loading{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;color:#fff;font:500 16px system-ui,sans-serif}
#loading img{width:min(420px,70vw);max-height:35vh;object-fit:contain;border-radius:6px}
#progress{width:min(300px,65vw);height:8px;margin-top:18px;border-radius:99px;background:#333;overflow:hidden}
#bar{height:100%;width:0;background:#e33;transition:width .15s}
#status{margin-top:10px;color:#aaa;font-size:14px}
</style>
</head>
<body>
<div id="unity-container" style="display:none"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
<div id="loading"><img src="./25050801/loading.png" alt="Escape Road 2"><div id="progress"><div id="bar"></div></div><div id="status">Game Loading...</div></div>
<script>
var buildUrl='Build', versionFolder='25050801/';
var config={
 dataUrl:buildUrl+'/escape-road-2-v25050801.data.unityweb',
 frameworkUrl:buildUrl+'/escape-road-2-v25050801.framework.js.unityweb',
 codeUrl:buildUrl+'/escape-road-2-v25050801.wasm.unityweb',
 streamingAssetsUrl:versionFolder+'StreamingAssets', companyName:'azgames.io', productName:'Escape Road 2', productVersion:'25050801', pubId:'',
 gameId:'escape-road-2', eventLog:false, enableMoreGame:'no', enablePromotion:false, gdHost:true, sdkType:'gd', gdGameId:'USE_GD_GAME_ID_CODE'
};
var progressElement=document.getElementById('bar'),container=document.getElementById('unity-container'),canvas=document.getElementById('unity-canvas'),loading=document.getElementById('loading'),status=document.getElementById('status');
var script=document.createElement('script'); script.src=buildUrl+'/escape-road-2-v25050801.loader.js';
script.onload=function(){createUnityInstance(canvas,config,function(progress){progressElement.style.width=(100*progress)+'%';status.textContent=progress>=.99?'Game Loading ...':'Downloading file: '+Math.round(progress*100)+'%'}).then(function(unityInstance){window.unityInstance=unityInstance;setTimeout(function(){loading.style.display='none';container.style.display='block';canvas.focus();window.focus()},500)}).catch(function(error){status.textContent='Unable to load the game.';console.error(error)})};
document.body.appendChild(script);
window.firebase={initializeApp:function(){return{}},analytics:function(){return{setUserProperties:function(){},logEvent:function(){}}}};
window.firebaseSetUserProperties=function(){};window.firebaseLogEvent=function(){};window.firebaseLogEventParameter=function(){};
</script>
</body>
</html>
